name = "kismayo-api"
main = "src/index.ts"
compatibility_date = "2025-01-29"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "YOUR_HYPERDRIVE_ID"

[vars]
API_URL = "https://kismayo-api.your-subdomain.workers.dev"
CUSTOMER_URL = "https://kismayo-menu.pages.dev"
ADMIN_URL = "https://kismayo-admin.pages.dev"
KITCHEN_URL = "https://kismayo-kitchen.pages.dev"

[env.production]
vars = { API_URL = "https://api.kismayo.so", CUSTOMER_URL = "https://kismayo.so", ADMIN_URL = "https://admin.kismayo.so", KITCHEN_URL = "https://kitchen.kismayo.so" }
